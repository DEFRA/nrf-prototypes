# Flow and logic for the "Request to use" journey.
#
# Copy lives in pages/*.md. This file decides the order of pages, where each
# answer leads and what is remembered in the session. See content/README.md.
#
# A developer with a quote retrieves it with their NRL reference, reviews and
# amends the development details, accepts the levy amount, signs in (or
# creates an account) with the mock GOV.UK One Login or Government Gateway
# and confirms who the developer is. On submission they get an email and a
# commitment certificate to give to their local planning authority.
# Behaviour that needs code (the mock quote store, sign-in accounts, the NRL
# reference) is in app/lib/nrf-request-to-use-1/hooks.js.
#
# The sign-in, account creation and Defra ID registration pages are shared
# with any other journey that signs users in: their copy lives in
# content/shared/one-login, government-gateway and defra-id.
#
# The development details (planning type, housing, units, the map) and the
# delete flow are the quote journey's own pages, borrowed rather than copied:
# the Change links and the "No, delete my quote details" answer leave for
# /nrf-quote-7/... with the way back in `nav`, and those pages return here.
# Update the paths when a newer quote version becomes the target.

id: nrf-request-to-use-1
name: Request to use the nature restoration levy
serviceName: Request to use the nature restoration levy
start: start

# Pages with Change links. A `goto: $summary` returns to whichever of these the
# user came from.
summaryPages:
  - review-quote-details
  - review-developer-details
  - review-your-details
  - check-your-answers
  - defra-check-answers
  - defra-business-check-answers

# When this holds the header shows Sign out and, for agents, the organisation
# they are acting for
signedIn: { key: account, isSet: true }

# Card shown on the homepage. `family` picks the tab, `version` orders it
# against the other versions in that family. See app/config/shared/journeys.yaml.
homepage:
  family: request-to-use
  version: 1
  status: in-progress
  title: Request to use the nature restoration levy (V1)
  description: >-
    A developer retrieves their quote with the NRL reference, reviews and
    amends the development details, accepts the levy amount, signs in with
    GOV.UK One Login and confirms the developer details. On submission they
    receive an email and a commitment certificate to submit with their
    planning application.
  changes:
    - quote journey and request to use journey - contact details updated throughout the journeys
    - new start page content including request to use, Defra ID guidance links, information about file uploads, when to assume liability
    - quote journey includes new details component with file upload guidance
    - added branching page to quote or request to use
    - retrieving a quote and reviewing the details
    - accepting a quote amount
    - variation to an existing planning application questions
    - Defra account user type questions
    - added Defra ID guidance pages to the journey based on the user type
    - full Defra ID journey added
    - fields for additional name and address details added based on the user type
    - check your answers page with declaration tick box 
    - Defra check answers page with declaration tick box 
    - updated commitment certificate page with updated planning conditions
# Every session key this journey writes. `clears: $session` expands to this,
# so the quote keys are included: deleting the quote details here also removes
# a quote made in the same session. `nrfReference` is the reference the quote
# journey minted, kept so typing it pulls that quote up; `quoteReference` and
# `retrievalEmail` are what the user types here (the quote's own
# `estimateEmail` stays in the cache untouched).
session:
  - journeyType
  - hasNrlReference
  - quoteReference
  - retrievalEmail
  - nrfReference
  - estimateEmail
  - planningType
  - isHousing
  - residentialBuildingCount
  - hasRedlineBoundaryFile
  - redlineFile
  - redlineBoundaryPolygon
  - mapReferrer
  - intersectingCatchment
  - quoteLoaded
  - quotedUnits
  - quotedLevyAmount
  - levyAmount
  - levyIncreased
  - edpName
  - acceptLevy
  - isVariation
  - originalCommitted
  - originalReference
  - defraUserType
  - employeeInvited
  - signInMethod
  - signInEmail
  - securityCodeMethod
  - mobileNumber
  - governmentGatewayName
  - governmentGatewayUserId
  - account
  - representedOrganisation
  - developerDetails
  - yourAddress
  - detailsConfirmed
  - informationConfirmed
  - nrlReference
  - certificate
  # Defra ID registration (sign-in emails containing "new")
  - defraAccountType
  - defraName
  - defraTelephone
  - defraPostcode
  - defraAddress
  - defraAddressManual
  - defraMemorableWord
  - defraTradingUk
  - defraHasCrn
  - defraCrn
  - defraBusinessContact
  - defraAccountCreated
  - defraContactSupportId

# Sample answers used when a page is opened with ?preview=1 and on the
