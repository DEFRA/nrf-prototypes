# Flow and logic for the "Request to use" journey.
#
# Copy lives in pages/*.md. This file decides the order of pages, where each
# answer leads and what is remembered in the session. See content/README.md.
#
# A developer with a quote retrieves it with their NRL reference, reviews and
# amends the development details, accepts the levy amount, signs in (or
# creates an account) with the mock GOV.UK One Login or Government Gateway
# and confirms who the developer is. On submission they get an email and a
# commitment certificate to give to their local planning authority.
# Behaviour that needs code (the mock quote store, sign-in accounts, the NRL
# reference) is in app/lib/nrf-request-to-use-1/hooks.js.
#
# The sign-in, account creation and Defra ID registration pages are shared
# with any other journey that signs users in: their copy lives in
# content/shared/one-login, government-gateway and defra-id.
#
# The development details (planning type, housing, units, the map) and the
# delete flow are the quote journey's own pages, borrowed rather than copied:
# the Change links and the "No, delete my quote details" answer leave for
# /nrf-quote-7/... with the way back in `nav`, and those pages return here.
# Update the paths when a newer quote version becomes the target.

id: nrf-request-to-use-1
name: Request to use the nature restoration levy
serviceName: Request to use the nature restoration levy
start: start

# Pages with Change links. A `goto: $summary` returns to whichever of these the
# user came from.
summaryPages:
  - review-quote-details
  - review-developer-details
  - review-your-details
  - check-your-answers
  - defra-check-answers
  - defra-business-check-answers

# When this holds the header shows Sign out and, for agents, the organisation
# they are acting for
signedIn: { key: account, isSet: true }

# Card shown on the homepage. `family` picks the tab, `version` orders it
# against the other versions in that family. See app/config/shared/journeys.yaml.
homepage:
  family: request-to-use
  version: 1
  status: in-progress
  title: Request to use the nature restoration levy (V1)
  description: >-
    A developer retrieves their quote with the NRL reference, reviews and
    amends the development details, accepts the levy amount, signs in with
    GOV.UK One Login and confirms the developer details. On submission they
    receive an email and a commitment certificate to submit with their
    planning application.
  changes:
    - Retrieve a quote by NRL reference and email, review and amend the details on the quote journey's own pages (borrowed, not copied)
    - Levy increased and not enough capacity branches, driven by the number of units
    - Variation to an existing planning application, then whether the original application was committed to using the levy
    - Mock GOV.UK One Login sign in (create or sign in, email, then password), shared with other journeys
    - Mock "Create your GOV.UK One Login" flow (email, security code, password, security codes by text message or authenticator app)
    - Mock Government Gateway sign in and "Create sign in details" flow (email, confirmation code, name, password, user ID)
    - Agent, company and individual account types decided by the sign-in email (agent by default)
    - Mock Defra ID registration for sign-in emails containing "new" (new-individual@, new-company@, new@ for an agent), as an individual or a business; the registration answer decides the account type
    - Developer details or your address, review, check your answers, confirmation
    - Email and commitment certificate with the red line boundary on a map
    - Built from content files, so copy and flow can change without code

# Every session key this journey writes. `clears: $session` expands to this,
# so the quote keys are included: deleting the quote details here also removes
# a quote made in the same session. `nrfReference` is the reference the quote
# journey minted, kept so typing it pulls that quote up; `quoteReference` and
# `retrievalEmail` are what the user types here (the quote's own
# `estimateEmail` stays in the cache untouched).
session:
  - journeyType
  - hasNrlReference
  - quoteReference
  - retrievalEmail
  - nrfReference
  - estimateEmail
  - planningType
  - isHousing
  - residentialBuildingCount
  - hasRedlineBoundaryFile
  - redlineFile
  - redlineBoundaryPolygon
  - mapReferrer
  - intersectingCatchment
  - quoteLoaded
  - quotedUnits
  - quotedLevyAmount
  - levyAmount
  - levyIncreased
  - edpName
  - acceptLevy
  - isVariation
  - originalCommitted
  - originalReference
  - signInMethod
  - signInEmail
  - securityCodeMethod
  - mobileNumber
  - governmentGatewayName
  - governmentGatewayUserId
  - account
  - developerDetails
  - yourAddress
  - detailsConfirmed
  - nrlReference
  - certificate
  # Defra ID registration (sign-in emails containing "new")
  - defraAccountType
  - defraName
  - defraTelephone
  - defraPostcode
  - defraAddress
  - defraAddressManual
  - defraMemorableWord
  - defraTradingUk
  - defraHasCrn
  - defraCrn
  - defraBusinessContact
  - defraAccountCreated

# Sample answers used when a page is opened with ?preview=1 and on the
# screen wall at /tools/journeys/nrf-request-to-use-1. Never written to the session.
preview:
  data:
    journeyType: request-to-use
    hasNrlReference: 'Yes'
    quoteReference: NRL-123456
    retrievalEmail: developer@example.com
    estimateEmail: developer@example.com
    planningType: Full planning permission
    isHousing: 'Yes'
    residentialBuildingCount: 120
    hasRedlineBoundaryFile: false
    mapReferrer: redline-map
    redlineBoundaryPolygon:
      center: [1.115, 52.565]
      coordinates:
        - [1.11, 52.56]
        - [1.12, 52.56]
        - [1.12, 52.57]
        - [1.11, 52.57]
      intersections:
        nutrient: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
      intersectingCatchment: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
    intersectingCatchment: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
    edpName: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
    quoteLoaded: NRL-123456
    quotedUnits: 100
    quotedLevyAmount: '25,000'
    levyAmount: '30,000'
    levyIncreased: true
    acceptLevy: 'Yes'
    isVariation: 'Yes'
    originalCommitted: 'Yes'
    originalReference: NRL-654321
    signInMethod: one-login
    signInEmail: agent@example.com
    securityCodeMethod: app
    mobileNumber: 07700 900123
    governmentGatewayName: John Smith
    governmentGatewayUserId: 43 93 78 15 57 40
    account:
      accountType: agent
      fullName: Name Name
      businessName: Agent Ltd
      organisationName: Organisation name
      email: agent@example.com
    developerDetails:
      fullName: A Developer
      addressLine1: Development Road
      addressLine2: ''
      town: Development
      county: ''
      postcode: DV1 6RP
    yourAddress:
      addressLine1: 53 Business Lane
      addressLine2: ''
      town: Business
      county: ''
      postcode: LP1 7RF
    detailsConfirmed: 'Yes'
    defraAccountType: individual
    defraName:
      firstName: John
      lastName: Smith
    defraTelephone:
      telephoneNumber: '07900 123456'
    defraPostcode:
      postcode: SW1A 1AA
    defraAddress: 1 Church Street, London, SW1A 1AA
    defraMemorableWord:
      memorableWord: sundance
      hintQuestion: What is the name of my first school?
    defraTradingUk: 'Yes'
    defraHasCrn: 'Yes'
    defraCrn:
      companyRegistrationNumber: '09084488'
    defraBusinessContact:
      telephoneNumber: '07900 123456'
      emailAddress: hello@acme.com
    nrlReference: NRL-912665
    certificate:
      issueDate: 1 September 2026
      expiryDate: 1 March 2027

pages:
  # The start page and "What would you like to do?" are shared with the quote
  # journey: copy lives in content/shared/pages/. Only the answer that stays in
  # this journey continues here; the other leaves for the quote journey's
  # first question. Update that path when a newer quote version becomes the
  # target.
  - id: start
    shared: true
    next: what-would-you-like-to-do

  - id: what-would-you-like-to-do
    shared: true
    next:
      - when: { key: journeyType, equals: quote }
        goto: /nrf-quote-7/planning-type
      - goto: have-nrl-reference

  # Guidance linked from the start page; outside the main flow for now
  - id: creating-defra-account
    shared: true
    back: start

  # Without a reference there is no quote to use: get one first
  - id: have-nrl-reference
    field: has-nrl-reference
    sessionKey: hasNrlReference
    next:
      - when: { key: hasNrlReference, equals: 'No' }
        goto: /nrf-quote-7/planning-type
      - goto: quote-reference

  # Stored apart from the quote journey's `nrfReference` so a quote made in
  # the same session never fills the box in: the user arrives afresh and types
  # the reference from their email, which pulls the cached quote up
  - id: quote-reference
    field: nrf-reference
    sessionKey: quoteReference
    changeable: true
    handler: custom # checks the reference format, see hooks.js
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: email

  # The email the retrieval link goes to, typed afresh like the reference
  - id: email
    field: email
    sessionKey: retrievalEmail
    changeable: true
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: retrieve-email

  # The email with the retrieval link. Following the link loads the quote.
  - id: retrieve-email
    next: review-quote-details

  - id: review-quote-details
    guard: { key: quoteReference, isSet: true, redirect: quote-reference }
    handler: custom # loads the quote, recalculates the levy, see hooks.js
    next:
      - when: { key: residentialBuildingCount, gt: 15000 }
        goto: not-enough-capacity
      - when: { key: levyIncreased, truthy: true }
        goto: levy-increased
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: accept-levy

  # The development details are changed on the quote journey's own pages:
  # the Change links on review-quote-details and check-your-answers point at
  # /nrf-quote-7/planning-type, housing, units and map, which come back here.

  - id: not-enough-capacity
    back: review-quote-details

  # Deleting the quote details happens on the quote journey's delete pages;
  # `return` gives them the way back for Back and Cancel
  - id: levy-increased
    field: accept-levy
    sessionKey: acceptLevy
    changeable: true
    store:
      'Yes, accept the new amount': 'Yes'
      'No, delete my quote details': 'No'
    next:
      - when: { key: acceptLevy, equals: 'No' }
        goto: /nrf-quote-7/delete-quote
        return: review-quote-details
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: variation

  - id: accept-levy
    field: accept-levy
    sessionKey: acceptLevy
    changeable: true
    store:
      'Yes, accept this amount': 'Yes'
      'No, delete my quote details': 'No'
    next:
      - when: { key: acceptLevy, equals: 'No' }
        goto: /nrf-quote-7/delete-quote
        return: review-quote-details
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: variation

  # A variation only needs the original NRL reference when the original
  # application was committed to using the levy
  - id: variation
    field: variation
    sessionKey: isVariation
    changeable: true
    next:
      - when: { key: isVariation, equals: 'Yes' }
        goto: original-committed
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: sign-in-method

  - id: original-committed
    field: original-committed
    sessionKey: originalCommitted
    changeable: true
    guard: { key: isVariation, equals: 'Yes', redirect: variation }
    next:
      - when: { key: originalCommitted, equals: 'Yes' }
        goto: original-reference
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: sign-in-method

  - id: original-reference
    field: original-reference
    sessionKey: originalReference
    changeable: true
    handler: custom # checks the reference format, see hooks.js
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: sign-in-method

  - id: sign-in-method
    field: sign-in-method
    sessionKey: signInMethod
    handler: custom # registers the sign-out route, see hooks.js
    store:
      Sign in with GOV.UK One Login: one-login
      Sign in with Government Gateway: government-gateway
    next:
      - when: { key: signInMethod, equals: government-gateway }
        goto: government-gateway-sign-in
      - goto: one-login-start

  # Mock GOV.UK One Login, shared with other journeys
  # (content/shared/one-login/). "Sign in" leads to the email page; the
  # "Create your GOV.UK One Login" button links to one-login-create-email.
  - id: one-login-start
    shared: one-login
    next: one-login-email

  - id: one-login-email
    shared: one-login
    next: one-login-password

  # Signing in, or finishing creating an account, decides the account type
  # from the email. A sign-in email containing "new" has no Defra account yet
  # and registers one first (new-individual@, new-company@, new@ for an agent)
  - id: one-login-password
    shared: one-login
    handler: custom # decides the account type from the email, see hooks.js
    next: &signed-in
      - when: { key: account.needsDefraAccount, truthy: true }
        goto: defra-register
      - when: { key: account.accountType, in: [company, individual] }
        goto: your-address
      - goto: developer-details

  # Creating a GOV.UK One Login: email, code from the email, password, then
  # security codes by text message (two pages) or authenticator app (one)
  - id: one-login-create-email
    shared: one-login
    next: one-login-check-email

  - id: one-login-check-email
    shared: one-login
    guard: { key: signInEmail, isSet: true, redirect: one-login-create-email }
    next: one-login-create-password

  - id: one-login-create-password
    shared: one-login
    guard: { key: signInEmail, isSet: true, redirect: one-login-create-email }
    next: one-login-security-codes

  - id: one-login-security-codes
    shared: one-login
    guard: { key: signInEmail, isSet: true, redirect: one-login-create-email }
    next:
      - when: { key: securityCodeMethod, equals: sms }
        goto: one-login-phone-number
      - goto: one-login-authenticator

  - id: one-login-phone-number
    shared: one-login
    guard: { key: securityCodeMethod, equals: sms, redirect: one-login-security-codes }
    next: one-login-check-phone

  - id: one-login-check-phone
    shared: one-login
    guard: { key: mobileNumber, isSet: true, redirect: one-login-phone-number }
    next: one-login-created

  - id: one-login-authenticator
    shared: one-login
    guard: { key: signInEmail, isSet: true, redirect: one-login-create-email }
    next: one-login-created

  - id: one-login-created
    shared: one-login
    guard: { key: signInEmail, isSet: true, redirect: one-login-create-email }
    handler: custom # signs in with the new account, see hooks.js
    next: *signed-in

  # Mock Government Gateway, shared with other journeys
  # (content/shared/government-gateway/). Signing in reads the user ID the
  # way One Login reads the email (company, individual, new-...); "Create
  # sign in details" on the page links to government-gateway-email.
  - id: government-gateway-sign-in
    shared: government-gateway
    handler: custom # decides the account type from the user ID, see hooks.js
    next: *signed-in

  - id: government-gateway-email
    shared: government-gateway
    next: government-gateway-confirm-email

  - id: government-gateway-confirm-email
    shared: government-gateway
    guard: { key: signInEmail, isSet: true, redirect: government-gateway-email }
    next: government-gateway-email-confirmed

  - id: government-gateway-email-confirmed
    shared: government-gateway
    guard: { key: signInEmail, isSet: true, redirect: government-gateway-email }
    next: government-gateway-name

  - id: government-gateway-name
    shared: government-gateway
    guard: { key: signInEmail, isSet: true, redirect: government-gateway-email }
    next: government-gateway-create-password

  - id: government-gateway-create-password
    shared: government-gateway
    guard: { key: governmentGatewayName, isSet: true, redirect: government-gateway-name }
    next: government-gateway-user-id

  - id: government-gateway-user-id
    shared: government-gateway
    guard: { key: governmentGatewayName, isSet: true, redirect: government-gateway-name }
    handler: custom # mints the user ID and signs in with the new account, see hooks.js
    next: *signed-in

  # Mock Defra ID: register a Defra account (content/shared/defra-id/). The
  # business or individual answer picks the screens and, on the check your
  # answers page, the account type for the rest of the journey (see
  # hooks.js). Every page needs the sign in first.
  - id: defra-register
    shared: defra-id
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next: defra-terms

  - id: defra-terms
    shared: defra-id
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next: defra-what-we-need

  - id: defra-what-we-need
    shared: defra-id
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next: defra-registration-type

  - id: defra-registration-type
    shared: defra-id
    field: registration-type
    sessionKey: defraAccountType
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    store:
      Yes, and I have permission to create an account: business
      No, as an individual for personal use: individual
    next:
      - when: { key: defraAccountType, equals: individual }
        goto: defra-name
      - goto: defra-trading-uk

  # Individual: name, telephone, address (found or entered), memorable word
  - id: defra-name
    shared: defra-id
    sessionKey: defraName
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-telephone

  - id: defra-telephone
    shared: defra-id
    sessionKey: defraTelephone
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-postcode

  # Find address: the postcode leads to a fixed list; the links on both pages
  # go to the manual address form
  - id: defra-postcode
    shared: defra-id
    sessionKey: defraPostcode
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next: defra-select-address

  - id: defra-select-address
    shared: defra-id
    field: address
    sessionKey: defraAddress
    changeable: true
    handler: custom # forgets a manual address, see hooks.js
    guard: { key: defraPostcode, isSet: true, redirect: defra-postcode }
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-memorable-word

  - id: defra-address-manual
    shared: defra-id
    sessionKey: defraAddressManual
    changeable: true
    handler: custom # joins the lines into the address, see hooks.js
    guard: { key: account, isSet: true, redirect: sign-in-method }
    back:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-postcode
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-memorable-word

  - id: defra-memorable-word
    shared: defra-id
    sessionKey: defraMemorableWord
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-check-answers

  - id: defra-check-answers
    shared: defra-id
    guard: { key: account, isSet: true, redirect: sign-in-method }
    handler: custom # completes the registration and sets the account type, see hooks.js
    next:
      - when: { key: account.accountType, in: [company, individual] }
        goto: your-address
      - goto: developer-details

  # Business: registered to trade, company registration number (Companies
  # House fixture), contact details. "No" answers carry on: not trading in
  # the UK still asks for the number; no number skips to the contact details.
  - id: defra-trading-uk
    shared: defra-id
    field: trading-uk
    sessionKey: defraTradingUk
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-has-crn

  - id: defra-has-crn
    shared: defra-id
    field: has-crn
    sessionKey: defraHasCrn
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next:
      - when: { key: defraHasCrn, equals: 'No' }
        goto: defra-business-contact
      - goto: defra-crn

  - id: defra-crn
    shared: defra-id
    sessionKey: defraCrn
    changeable: true
    guard: { key: defraHasCrn, equals: 'Yes', redirect: defra-has-crn }
    next: defra-confirm-business

  - id: defra-confirm-business
    shared: defra-id
    guard: { key: defraCrn, isSet: true, redirect: defra-crn }
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-business-contact

  - id: defra-business-contact
    shared: defra-id
    sessionKey: defraBusinessContact
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: defra-business-check-answers

  - id: defra-business-check-answers
    shared: defra-id
    guard: { key: account, isSet: true, redirect: sign-in-method }
    handler: custom # completes the registration and sets the account type, see hooks.js
    preview:
      account:
        accountType: agent
        fullName: John Smith
        email: new@example.com
    next:
      - when: { key: account.accountType, in: [company, individual] }
        goto: your-address
      - goto: developer-details

  # Agents enter the developer they act for; companies and individuals give
  # their own address (their name comes from the account)
  - id: developer-details
    sessionKey: developerDetails
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: review-developer-details

  - id: review-developer-details
    guard: { key: developerDetails, isSet: true, redirect: developer-details }
    next:
      - goto: placeholder
        set: { detailsConfirmed: 'Yes' }

  # Placeholder for a page still to be designed, between confirming the
  # developer details and checking your answers
  - id: placeholder
    guard: { key: developerDetails, isSet: true, redirect: developer-details }
    next: check-your-answers

  - id: your-address
    sessionKey: yourAddress
    changeable: true
    guard: { key: account, isSet: true, redirect: sign-in-method }
    preview:
      account:
        accountType: company
        fullName: Name Name
        businessName: Developer Ltd
        email: company@example.com
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: review-your-details

  - id: review-your-details
    guard: { key: yourAddress, isSet: true, redirect: your-address }
    preview:
      account:
        accountType: company
        fullName: Name Name
        businessName: Developer Ltd
        email: company@example.com
    next:
      - goto: check-your-answers
        set: { detailsConfirmed: 'Yes' }

  - id: check-your-answers
    guard: { key: account, isSet: true, redirect: sign-in-method }
    handler: custom # mints the NRL reference and certificate dates, see hooks.js
    next: confirmation

  - id: confirmation

  - id: request-email
    back: confirmation

  - id: commitment-certificate
    back: confirmation
