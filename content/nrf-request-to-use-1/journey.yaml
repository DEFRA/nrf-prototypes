    mapReferrer: redline-map
    redlineBoundaryPolygon:
      center: [1.115, 52.565]
      coordinates:
        - [1.11, 52.56]
        - [1.12, 52.56]
        - [1.12, 52.57]
        - [1.11, 52.57]
      intersections:
        nutrient: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
      intersectingCatchment: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
    intersectingCatchment: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
    edpName: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
    quoteLoaded: NRL-123456
    quotedUnits: 100
    quotedLevyAmount: 'X,XXX'
    levyAmount: 'X,XXX'
    levyIncreased: true
    acceptLevy: 'Yes'
    isVariation: 'Yes'
