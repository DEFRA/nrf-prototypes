    originalReference: NRL-654321
    defraUserType: agent
    signInMethod: one-login
    signInEmail: agent@example.com
    securityCodeMethod: app
    mobileNumber: 07700 900123
    governmentGatewayName: John Smith
    governmentGatewayUserId: 43 93 78 15 57 40
    account:
      accountType: agent
      fullName: Name Name
      businessName: Agent Ltd
