# Canned data for the "Assume liability" journey: the developer records the
# signed-in developer is a primary or secondary user of, listed on "Manage
# the nature restoration levy".
#
# This is data, not page copy: the words on the pages are in pages/*.md.
# Edits show on the next page load (no restart). The code that reads it is
# app/lib/assume-liability-1/hooks.js.
#
#   statuses   every status a record can have: its tag label and the
#              govuk-tag colour (grey, green, turquoise, blue, light-blue,
#              purple, pink, red, orange, yellow), and `one`, the label
#              while only one person is left to sign. The same tags show on
#              the records, the record pages and the assumption document
#              (its own status, and each person's while it waits for them,
#              from `signatures`). A record starts at the
#              status given below; assuming liability in the journey moves
#              the primary user's record on to `signatures` (the document
#              waits for signatures), `signed` once everyone has signed
#              and then `liable`. A secondary user's record at
#              `sign` (they have been named as jointly liable) moves on to
#              `signatures` once they sign, or `signed` when nobody else is
#              left to
#   records    in the order the table lists them. `role` is the signed-in
#              user's: `primary` (the developer is their organisation, and
#              only they can assume liability) or `secondary` (someone
#              else, `primaryUser`, is the primary user). A primary record
#              with no `developer` shows the signed-in user's organisation.
#              `boundary` is the red line boundary, an open ring of
#              [longitude, latitude] pairs. Dates are YYYY-MM-DD.
#              A `levyAmount` under £50,000 cannot be paid in
#              instalments: assuming liability skips "How would you like
#              to pay?" and agrees to pay in full (hooks.js).
#              A secondary user's record at `sign` lists its assumption
#              document's `signatories` in order: each a `fullName`,
#              `organisation` (the signed-in user's when left out), `email`
#              and the date they `signed` (left out while the document waits
#              for them), and `you: true` where the signed-in user signs

statuses:
  ready: { label: Not started, colour: blue }
  sign: { label: Signature needed, colour: orange }
  awaiting-permission: { label: Waiting for planning permission, colour: grey }
  signatures: { label: Signatures needed, one: Signature needed, colour: yellow }
  signed: { label: Signed by everyone, colour: turquoise }
  liable: { label: Signed by everyone, colour: green }

edp: &edp 'Norfolk: Broads Special Area of Conservation (SAC) (Yare and Bure), Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2027 to 2037)'

