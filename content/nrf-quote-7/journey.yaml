# Flow and logic for the "Get a quote" journey.
#
# Copy lives in pages/*.md. This file decides the order of pages, where each
# answer leads, what is remembered in the session, and which pages need
# bespoke code (hooks in app/lib/nrf-quote-7/hooks.js).
#
# Conditions are objects: { key: <session key>, <operator>: <value> }.
# Operators: equals, notEquals, in, notIn, gt, gte, lt, lte, between,
# truthy, falsy, isSet. Engine values start with $: $navFromSummary,
# $isChange, $preview. See content/README.md.

id: nrf-quote-7
name: Get a quote for the nature restoration levy
serviceName: Get a quote for the nature restoration levy
start: start
summaryPage: check-your-answers

# Card shown on the homepage. `family` picks the tab, `version` orders it
# against the other versions in that family. See app/config/shared/journeys.yaml.
homepage:
  family: quote
  version: 7
  status: spike
  title: Get a quote for Nature Restoration Fund levy (V7, content-driven)
  description: >-
    The V6 quote journey rebuilt from plain content files. Copy lives in
    markdown, flow and branching in YAML, and the screens are generated by the
    prototype kit with no AI in the loop.
  changesTitle: What is different
  changes:
    - One markdown file per page in content/nrf-quote-7/pages/, owned by content design
    - Order, branching and session keys in content/nrf-quote-7/journey.yaml
    - Flow diagram and a live wall of every screen at /tools/journeys/nrf-quote-7
    - Map page kept as bespoke code, wired in through hooks
    - Starts on the start page and "What would you like to do?" shared with the request-to-use journey (content/shared/pages/)

# Every session key this journey writes. `clears: $session` expands to this.
session:
  - journeyType
  - planningType
  - isHousing
  - residentialBuildingCount
  - hasRedlineBoundaryFile
  - redlineFile
  - redlineBoundaryPolygon
  - mapReferrer
  - estimateEmail
  - nrfReference
  - levyAmount
  - intersectingCatchment

# Sample answers used when a page is opened with ?preview=1 and on the
# screen wall at /tools/journeys/nrf-quote-7. Never written to the session.
preview:
  data:
    journeyType: quote
    planningType: Full planning permission
    isHousing: 'Yes'
    residentialBuildingCount: 120
    hasRedlineBoundaryFile: false
    mapReferrer: redline-map
    redlineFile: site-boundary.geojson
    redlineBoundaryPolygon:
      center: [-1.1494, 52.9548]
      coordinates:
        - [-1.1544, 52.9518]
        - [-1.1444, 52.9518]
        - [-1.1444, 52.9578]
        - [-1.1544, 52.9578]
        - [-1.1544, 52.9518]
      intersections:
        nutrient: River Trent
        gcn: null
      intersectingCatchment: River Trent
    estimateEmail: jane.smith@example.com
    nrfReference: NRF-123456
    levyAmount: '2,500'

pages:
  # The start page and "What would you like to do?" are shared with the
  # request-to-use journey: copy lives in content/shared/pages/. Only the
  # answer that stays in this journey continues here; the other leaves for
  # the request-to-use journey's first question. Update that path when a
  # newer request-to-use version becomes the target.
  - id: start
    shared: true
    next: what-would-you-like-to-do

  - id: what-would-you-like-to-do
    shared: true
    next:
      - when: { key: journeyType, equals: request-to-use }
        goto: /nrf-request-to-use-1/have-nrl-reference
      - goto: planning-type

  # planning-type, housing, units and map are also the pages the
  # request-to-use journey's Change links open (borrowed with the way back
  # in `nav`); `goto: $summary` returns to whichever summary page sent the
  # user, in either journey
  - id: planning-type
    field: planning-type
    sessionKey: planningType
    changeable: true
    next:
      - when:
          key: planningType
          notIn:
            - Full planning permission
            - Outline planning permission
            - Hybrid planning permission
        goto: wrong-permission
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: housing

  - id: wrong-permission

  # Only the request-to-use journey changes this answer (from its review
  # page), so the return rule matters there rather than on the quote's own
  # check your answers
  - id: housing
    field: housing
    sessionKey: isHousing
    changeable: true
    next:
      - when: { key: isHousing, equals: 'No' }
        goto: not-housing
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: units

  - id: not-housing

  - id: units
    field: unit-count
    sessionKey: residentialBuildingCount
    min: 1
    changeable: true
    next:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: redline-map

  - id: redline-map
    field: has-redline-boundary-file
    sessionKey: hasRedlineBoundaryFile
    # The radio values are labels; store booleans in the session instead
    store:
      'Upload a file': true
      'Draw on a map': false
    next:
      - when: { key: hasRedlineBoundaryFile, truthy: true }
        goto: upload-redline
      - goto: map
        set: { mapReferrer: redline-map }

  - id: upload-redline
    field: redline-file
    sessionKey: redlineFile
    accept: ['.shp', '.geojson', '.kml']
    maxSize: 2MB
    changeable: true
    handler: custom # parses the GeoJSON, see hooks.js
    next: map # the map runs the EDP and capacity checks

  - id: map
    template: nrf-quote-7/map
    field: boundary-data
    handler: custom # EDP intersection check, see hooks.js
    changeable: true
    back:
      - when: { key: mapReferrer, equals: upload-redline }
        goto: upload-redline
      - goto: redline-map
    next:
      - when:
          { key: redlineBoundaryPolygon.intersections.nutrient, falsy: true }
        goto: no-edp
      - when: { key: residentialBuildingCount, gt: 15000, lt: 20000 }
        goto: exclusion
      - when: { key: residentialBuildingCount, gte: 20000 }
        goto: no-capacity
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: estimate-email

  - id: no-edp

  - id: exclusion

  - id: no-capacity
    back: units

  - id: estimate-email
    field: email
    sessionKey: estimateEmail
    changeable: true
    back:
      - when: { key: mapReferrer, equals: upload-redline }
        goto: upload-redline
      - goto: map
    next: check-your-answers

  - id: check-your-answers
    guard: { key: estimateEmail, isSet: true, redirect: estimate-email }
    handler: custom # mints the NRF reference, see hooks.js
    next: confirmation

  # Also used by the request-to-use journey ("No, delete my quote details"),
  # which arrives with the way back in `nav`; Back and Cancel then return to
  # its review page instead of check your answers
  - id: delete-quote
    back:
      - when: { key: $navFromSummary, truthy: true }
        goto: $summary
      - goto: check-your-answers
    clears: $session
    next: delete-confirmation

  - id: delete-confirmation

  - id: confirmation

  - id: estimate-email-content
    back: confirmation
