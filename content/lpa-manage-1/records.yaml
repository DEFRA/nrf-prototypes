# Canned data for the LPA "Manage commitments" journey: the commitments
# developers have submitted to Scarfolk Council, and the developer records
# the council's officers have already made from them.
#
# This is data, not page copy: the words on the pages are in pages/*.md.
# Edits show on the next page load (no restart). The code that reads it is
# app/lib/lpa-manage-1/hooks.js.
#
#   planningStages  the stages a planning application can be at, with
#                 the label the pages show for each
#   planningTypes   the short name the tables show for each planning
#                 permission type a commitment can have
#   statuses      every status a record can have: its tag label and the
#                 govuk-tag colour (grey, green, turquoise, blue, light-blue,
#                 purple, pink, red, orange, yellow), or `shownAs` another
#                 status to look like it in the tables, tags and filter.
#                 `for-review` is the status of a record an officer has
#                 just added (and stays so when they review it later),
#                 and `rejected` is final. The radios on
#                 pages/view-record.md offer reviewed and rejected; the
#                 others (withdrawn, cancelled) are set outside this
#                 prototype
#   officers      each officer's email, shown under their name on a
#                 record's history (an officer not listed gets
#                 firstname.lastname@scarfolk.gov.uk)
#   boundaries    named red line boundaries: open rings of [longitude,
#                 latitude] pairs. A commitment names one (or gives its own
#                 `coordinates`). Each is a real field or plot on the edge
#                 of the town in its name, traced from the Ordnance Survey
#                 MasterMap parcels the map draws (so the red line follows
#                 hedges and fences), named after the nearest road and
#                 sized for its commitment's homes at about 30 to 45 a
#                 hectare. All sit inside the Norfolk EDP and clear of its
#                 excluded areas
#   commitments   what developers have submitted, found by NRL reference on
#                 "Retrieve commitment details". Dates are YYYY-MM-DD.
#                 A commitment the developer made for a planning variation
#                 names the original application's commitment as
#                 `originalReference`: the two records link to each other.
#                 A commitment with a `record:` is already in the council's
#                 records (the dashboard and table show it, and retrieving
#                 it again says so); one without is waiting to be added
#   fallback      the commitment any other well-formed NRL reference
#                 retrieves (it takes the reference typed). Delete this
#                 block to make an unknown reference an error instead
#
# A record:
#   planningReference  the planning application it belongs to
#   originalPlanningReference  for a planning variation, the planning
#                      application the record was added with
#   planningStage      one of the planningStages below (the table's column
#                      and filter, and the dashboard's count cards). A
#                      record is `applied` until its commitment details
#                      are reviewed; the record page's radios then move it
#                      on
#   reservedMatters    for an outline planning application that has been
#                      granted, the reserved matters applications made
#                      under it: each a `reference`, a `status` (one of the
#                      planningStages) and a short `description`. The
#                      add-reserved-matters page adds more
#   overdue            true when an action on the record is overdue (the
#                      dashboard's third count card and the table's filter)
#   officer            who added it (the table's Officer column)
#   status             one of the statuses above
#   history            the audit timeline, oldest first: `event: added`,
#                      `event: review-later` (reviewing the details was put
#                      off), `event: status` (with the new `status`),
#                      `event: stage` (with the new planning `stage`) or
#                      `event: variation` (with the new
#                      `planningReference`), `event: reserved-matters`
#                      (with the reserved matters `planningReference`), and
#                      `by` and `at` (YYYY-MM-DDTHH:MM). The newest entry
#                      is "Last modified"

planningStages:
  applied: Applied
  granted: Granted
  refused: Refused
  under-appeal: Under appeal
  judicial-review: In judicial review

planningTypes:
  Full planning permission: Full
  Outline planning permission: Outline
  Reserved matters: Reserved

officers:
  John Smith: john.smith@scarfolk.gov.uk
  Priya Shah: priya.shah@scarfolk.gov.uk
  Aisha Khan: aisha.khan@scarfolk.gov.uk
  Tom Barker: tom.barker@scarfolk.gov.uk

statuses:
  for-review: { label: For review, colour: light-blue }
  reviewed: { label: Reviewed, colour: green }
  rejected: { label: Rejected, colour: red }
  withdrawn: { label: Withdrawn, colour: purple }
  cancelled: { label: Cancelled, colour: grey }

edp: &edp 'Norfolk: Broads Special Area of Conservation (SAC) (Yare and Bure), Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2027 to 2037)'

