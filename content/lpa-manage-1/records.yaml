# Canned data for the LPA "Manage commitments" journey: the commitments
# developers have submitted to Scarfolk Council, and the developer records
# the council's officers have already made from them.
#
# This is data, not page copy: the words on the pages are in pages/*.md.
# Edits show on the next page load (no restart). The code that reads it is
# app/lib/lpa-manage-1/hooks.js.
#
#   planningStages  the stages a planning application can be at, with
#                 the label the pages show for each
#   planningTypes   the short name the tables show for each planning
#                 permission type a commitment can have
#   statuses      every status a record can have: its tag label and the
#                 govuk-tag colour (grey, green, turquoise, blue, light-blue,
#                 purple, pink, red, orange, yellow). `received` is the
#                 status of a record an officer has just added. Every
#                 value is an option of the radios on pages/view-record.md
#   boundaries    named red line boundaries: open rings of [longitude,
#                 latitude] pairs. A commitment names one (or gives its own
#                 `coordinates`)
#   commitments   what developers have submitted, found by NRL reference on
#                 "Retrieve commitment details". Dates are YYYY-MM-DD.
#                 A commitment with a `record:` is already in the council's
#                 records (the dashboard and table show it, and retrieving
#                 it again says so); one without is waiting to be added
#   fallback      the commitment any other well-formed NRL reference
#                 retrieves (it takes the reference typed). Delete this
#                 block to make an unknown reference an error instead
#
# A record:
#   planningReference  the planning application it belongs to
#   planningStage      applied, refused or in-dispute (one of the
#                      planningStages below; the table's column and filter,
#                      and the dashboard's first two count cards, which
#                      leave out commitments past their expiry date)
#   overdue            true when an action on the record is overdue (the
#                      dashboard's third count card and the table's filter)
#   officer            who added it (the table's Officer column)
#   status             one of the statuses above
#   history            the audit timeline, oldest first: `event: added` or
#                      `event: status` (with the new `status`), `by` and `at`
#                      (YYYY-MM-DDTHH:MM). The newest entry is "Last modified"

planningStages:
  applied: Applied
  refused: Refused
  in-dispute: In dispute

planningTypes:
  Full planning permission: Full
  Outline planning permission: Outline
  Reserved matters: Reserved

statuses:
  received: { label: Received, colour: light-blue }
  confirmed: { label: Confirmed, colour: green }
  review-later: { label: Awaiting review, colour: yellow }
  rejected: { label: Rejected, colour: red }

