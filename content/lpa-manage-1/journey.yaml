# Flow and logic for the LPA journey "Manage commitments to the nature
# restoration levy".
#
# Copy lives in pages/*.md; the commitment details several pages show are in
# partials/commitment-details.md. The commitments and records the pages find
# are canned in records.yaml. This file decides the order of pages and where
# each answer leads. See content/README.md.
#
# A planning officer at Scarfolk Council signs in with the mock GOV.UK One
# Login and lands on the records the council already has (a dashboard with
# a table of every record), or, when the council has none yet (an email
# with "new" in it), straight on adding one: retrieve the commitment the
# developer made by its NRL reference and add the planning application
# reference, which adds the record. A reference the council already has a
# record for asks whether it is a planning variation; one that is takes
# the new planning application reference and keeps the original. Each
# record has its own page with an audit timeline and the review options
# (reviewing the commitment details, then the planning application's
# stage), and a full certificate a click away. Behaviour that needs code (the officer,
# the commitment store, the tables) is in app/lib/lpa-manage-1/hooks.js.
#
# Every page wears the staff layout: the service name and the officer's
# account (a dropdown holding the menu) in the header, and a wider page for
# tables. The One Login pages
# keep their own look.

id: lpa-manage-1
name: Manage commitments to the nature restoration levy
serviceName: Manage commitments to the nature restoration levy
start: one-login-email
layout: staff

# The staff header. Its account dropdown lists the menu links, then the
# account links. Links are page ids, absolute paths or `$signOut`.
header:
  organisation: Scarfolk Council
  homePage: dashboard
  account:
    - text: Your account
      href: '#'
    - text: Sign out
      href: $signOut
  menu:
    links:
      - text: Developer records
        href: dashboard
      - text: Create a developer record
        href: retrieve-commitment

# When this holds the header shows the officer's account dropdown
signedIn: { key: officer, isSet: true }

homepage:
  family: lpa
  version: 5
  status: in-progress
  title: Manage commitments to the nature restoration levy (V5)
  description: >-
    A planning officer at the local planning authority signs in with GOV.UK
    One Login, retrieves a developer's commitment by its NRL reference, adds
    the planning application reference and adds it to the council's records.
    They can change a record's status and look through every record in a
    searchable table on the dashboard.
  changes:
    - new service for LPA officers, with its own header and a wider page for tables
    - add a developer record from an NRL reference
    - record page with the developer record history and the review options
    - rejecting asks why on its own page, with an optional comment
    - review options start unchosen and Confirm returns to the dashboard; reviewing later is noted on the history
    - once the commitment details are reviewed, the options set the planning application's stage
    - full commitment certificate behind the record, with breadcrumbs
    - dashboard cards filter its table; overdue actions card
    - the dashboard's table of every record has sortable columns, a filter and pages, built from canned records
    - no check your answers page: adding the planning reference adds the record
    - no confirm commitment page: the NRL reference goes straight to the planning reference
    - an NRL reference already in the records asks whether it is a planning variation (placeholder copy); a variation takes the new planning application reference and the record shows both
    - planning type leads the record's planning details
    - a variation the developer made a commitment for (in request to use) links to the original application's record, and back
    - no "What would you like to do?" page: signing in opens the dashboard, or "Enter an NRL reference" for a council with no records yet (an email with "new" in it)

# The answers the copy can show, as {{ name }} (see content/README.md).
# `commitment` is the commitment on screen and `record` the record.
session:
  - officer
  - commitmentReference
  - commitmentEntry
  - commitment
  - commitmentRecorded
  - planningReference
  - planningVariation
  - planningVariationReference
  - recordReference
  - record
  - newStatus
  - rejectReason
  - lpaRecords
  - lpaFlash

# Sample answers for the screen wall and ?preview=1
preview:
  data:
    officer:
      fullName: John Smith
    recordReference: NRL-100231
    planningReference: 2026/0412/FUL
    commitment:
      reference: NRL-123456
      developer: ACME Developments
      address:
        line1: 1 Industrial Estate
        line2: Scarfolk
        line3: SC1 4AB
      planningType: Full planning permission
      units: 120
      edp: Broads SAC, Broadland Ramsar and River Wensum SAC Environmental Delivery Plan addressing nutrient pollution (2026 to 2036)
      levyAmount: X,XXX
      issued: 5 September 2026
      expires: 5 March 2027
      boundary:
        coordinates:
          - [1.11, 52.56]
          - [1.12, 52.56]
          - [1.12, 52.57]
          - [1.11, 52.57]

groups:
  one-login:
    title: GOV.UK One Login

pages:
  # Mock GOV.UK One Login, shared with other journeys
  # (content/shared/one-login/). Officers already have an account, so the
  # journey opens on the sign in page itself: no "create or sign in" page
  # and no account creation.
  - id: one-login-email
    shared: one-login
    handler: custom # registers the sign-out route, see hooks.js
    next: one-login-password

  # Signing in makes the participant (or a stand-in) the officer and opens
  # the council's records. An email with "new" in it is a council with no
  # records yet, which goes straight on to adding its first (hooks.js).
  - id: one-login-password
    shared: one-login
    guard: { key: signInEmail, isSet: true, redirect: one-login-email }
    handler: custom # signs the officer in, see hooks.js
    next:
      - when: { key: officer.hasRecords, truthy: true }
        goto: dashboard
      - goto: retrieve-commitment

  # --------------------------------------------------------------------
  # Create a developer record. The reference finds the commitment in
  # records.yaml (or the one made in nrf-request-to-use-1 this session).
  # One the council already has a record for asks whether it is a planning
  # variation. See hooks.js. With no records yet there is no Back link.
  - id: retrieve-commitment
    field: commitment-reference
    sessionKey: commitmentReference
    guard: &signed-in { key: officer, isSet: true, redirect: one-login-email }
    back: dashboard
    handler: custom
    next:
      - when: { key: commitmentRecorded, truthy: true }
        goto: planning-variation
      - goto: planning-reference

  # Placeholder copy. No opens the record the council already has.
  - id: planning-variation
    field: planning-variation
    sessionKey: planningVariation
    guard: { key: commitmentRecorded, truthy: true, redirect: retrieve-commitment }
    handler: custom # No opens the existing record, see hooks.js
    next:
      - when: { key: planningVariation, equals: 'yes' }
        goto: planning-variation-reference
      - goto: view-record
    preview:
      data:
        record: { planningReference: 2026/0412/FUL }

  # The variation's new planning application reference: the record takes it
  # and keeps the original, then opens (hooks.js)
  - id: planning-variation-reference
    field: planning-variation-reference
    sessionKey: planningVariationReference
    guard: { key: planningVariation, equals: 'yes', redirect: planning-variation }
    handler: custom
    next: view-record

  # Continuing adds the record to the session's records and opens its page
  - id: planning-reference
    field: planning-reference
    sessionKey: planningReference
    guard: { key: commitmentEntry, isSet: true, redirect: retrieve-commitment }
    handler: custom # adds the record, see hooks.js
    next: view-record

  # --------------------------------------------------------------------
  # A record: view-record?ref=NRL-123456. The review options at the bottom
  # post back here; the change goes on the audit timeline and Confirm
  # returns to the dashboard (hooks.js). Rejecting asks why first.
  - id: view-record
    template: lpa-manage-1/view-record
    field: new-status
    sessionKey: newStatus
    guard: *signed-in
    back: dashboard
    handler: custom
    preview:
      variants:
        - id: added
          label: Just added
          data: { lpaFlash: added }
        - id: planning
          label: Reviewed (planning stages)
          data: { recordReference: NRL-100903 }
        - id: variation
          label: Planning variation
          data: { recordReference: NRL-100487 }
        - id: linked
          label: Linked to the original application's record
          data: { recordReference: NRL-101412 }

  # Why the commitment details are rejected, with an optional comment.
  # Confirm rejects the record for good and returns to the dashboard.
  - id: reject-commitment
    template: lpa-manage-1/reject-commitment
    field: reject-reason
    sessionKey: rejectReason
    guard: { key: recordReference, isSet: true, redirect: dashboard }
    back: view-record
    handler: custom

  # Every detail of a record's commitment: certificate?ref=NRL-123456.
  # Breadcrumbs lead back to the dashboard and the record.
  - id: certificate
    template: lpa-manage-1/certificate
    guard: *signed-in

  # The records the council has: counts, then a table searched, filtered,
  # sorted and paged. The landing page, so no Back link; a council with no
  # records yet is sent to "Enter an NRL reference" (hooks.js).
  - id: dashboard
    template: lpa-manage-1/dashboard
    guard: *signed-in
    back: []
    preview:
      variants:
        - id: updated
          label: Record updated
          data: { lpaFlash: updated }
