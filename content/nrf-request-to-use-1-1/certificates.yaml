# Dummy commitment certificates for stakeholders: each one opens on its own
# at commitment-certificate?ref=<reference>, for example
#
#   /nrf-request-to-use-1-1/commitment-certificate?ref=NRL-900001
#
# and the page's print link saves it as a PDF. Opening one never touches
# the session, so it can be shared without a journey behind it, and a
# research participant's answers are left alone. They show no price: the
# levy amount is always the £X,XXX placeholder.
#
# This is data, not page copy: the certificate's words are in
# pages/commitment-certificate.md. Edits show on the next page load (no
# restart). The code that reads it is app/lib/nrf-request-to-use-1-1/hooks.js.
#
#   boundaries    named red line boundaries: open rings of [longitude,
#                 latitude] pairs. Each is the red line from the
#                 application's planning portal map (screenshots, November
#                 2026), placed by matching that map to Ordnance Survey
#                 MasterMap. All are inside the Norfolk EDP and clear of its
#                 excluded areas
#   certificates  one entry per certificate
#
# A certificate:
#   reference      the NRL reference in its link and on the certificate
#                  (NRL- and six digits)
#   fullName       the developer's name
#   businessName   the business the certificate is for; leave it out for an
#                  individual, and the certificate has no Business name line
#   addressLine1   the first line of the address, then its town and postcode
#   town           (the certificate shows these three on one line)
#   postcode
#   units          the number of homes
#   issued         the date of issue, YYYY-MM-DD; leave it out for today
#   expires        the expiry date, YYYY-MM-DD; leave it out for six months
#                  after `issued`
#   boundary       one of the boundaries below, or `coordinates:` with a
#                  ring of its own
#   edp            the EDP's full name as content/shared/edps.yaml gives it
#                  (its obligation comes from there); leave it out for the
#                  Norfolk EDP

