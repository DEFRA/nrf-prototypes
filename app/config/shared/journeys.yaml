    entryPath: ''

  - id: nrf-estimate-2
    family: other
    status: spike
    name: NRF Estimate 2
    title: Estimate, commit and pay (intermediate build)
    description: >-
      Intermediate estimate, commit and pay iteration between V1 and V2. Kept
